<div class="flex min-h-dvh items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <img
        src="assets/logo-principal.png"
        alt="Forró Ruby"
        class="mx-auto mb-4 h-32 w-auto object-contain drop-shadow-[0_0_25px_rgba(230,57,80,0.35)]"
      />
      <h1 class="text-2xl font-bold tracking-wide">
        Sistema <span class="text-ruby-500">Forró Ruby</span>
      </h1>
      <p class="mt-1 text-sm text-slate-400">Entre com sua conta da banda</p>
    </div>

    <form
      class="space-y-4 rounded-2xl border border-white/10 bg-white/5 p-8 shadow-[0_8px_32px_rgba(0,0,0,0.4)] backdrop-blur-xl"
      (ngSubmit)="vm.submit()"
    >
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-slate-300">E-mail</label>
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="voce@forroruby.com"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-slate-500 backdrop-blur-sm transition-all duration-200 focus:border-ruby-500/60 focus:bg-white/10 focus:outline-none"
          [ngModel]="vm.email()"
          (ngModelChange)="vm.email.set($event)"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-slate-300">Senha</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder:text-slate-500 backdrop-blur-sm transition-all duration-200 focus:border-ruby-500/60 focus:bg-white/10 focus:outline-none"
          [ngModel]="vm.password()"
          (ngModelChange)="vm.password.set($event)"
        />
      </div>

      @if (vm.errorMessage()) {
        <p class="rounded-xl border border-ruby-500/30 bg-ruby-700/15 px-4 py-3 text-sm text-ruby-300">
          {{ vm.errorMessage() }}
        </p>
      }

      <button
        type="submit"
        [disabled]="vm.isLoading()"
        class="w-full rounded-xl bg-gradient-to-r from-ruby-700 to-ruby-500 px-6 py-3 font-semibold text-white shadow-[0_0_20px_rgba(230,57,80,0.35)] transition-all duration-200 hover:from-ruby-600 hover:to-ruby-400 hover:shadow-[0_0_30px_rgba(230,57,80,0.55)] active:scale-95 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ vm.isLoading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
